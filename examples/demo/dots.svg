<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Personal Agent：一次交代，持续跟进"><rect width="1000" height="440" rx="24" fill="#eeeae0"/><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#31392e}.label{font-size:25px;font-weight:600}.small{font-size:19px;fill:#6d7266}</style><text x="40" y="56" font-size="28" font-weight="600">Personal Agent：一次交代，持续跟进</text><text x="40" y="90" class="small">依据作者体验整理；能否完成任务仍受外部平台访问条件影响</text><rect x="40" y="145" width="230" height="160" rx="20" fill="#fffdf7"/><text x="65" y="202" class="label">告诉它目标</text><text x="65" y="244" class="small">例如：关注返程机票</text><path d="M290 225H355m-12-10 12 10-12 10" fill="none" stroke="#9f553d" stroke-width="4"/><rect x="380" y="145" width="240" height="160" rx="20" fill="#d9e1cc"/><text x="405" y="202" class="label">记住背景，跟进</text><text x="405" y="244" class="small">偏好 · 行程 · 价格变化</text><path d="M640 225H705m-12-10 12 10-12 10" fill="none" stroke="#9f553d" stroke-width="4"/><rect x="730" y="145" width="230" height="160" rx="20" fill="#fffdf7"/><text x="755" y="202" class="label">变化时提醒</text><text x="755" y="244" class="small">人再判断、决定下一步</text><path d="M850 325V350H155V325" stroke="#a5ac98" fill="none" stroke-width="2"/><text x="370" y="375" class="small">重点是持续跟进，而非一次回答</text><text x="40" y="411" class="small">稍后听 · 概念示意，非产品界面或实测数据</text></svg>